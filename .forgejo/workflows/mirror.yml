name: Mirror to GitHub

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: https://${{ secrets.FORGE_TOKEN }}@code.quickbasic.org/sigitex/actions/mirror@main
        with:
          target: sigitex/route
          token: ${{ secrets.MIRROR_TOKEN }}
